<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議摘要器 · Meeting Summarizer</title>
  <meta name="description" content="貼上會議逐字稿，AI 自動生成結構化摘要、決議事項與行動項目。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ──────────────────────────────────────────── */
    :root {
      --ink:      #1a1917;
      --paper:    #f5f2eb;
      --warm-mid: #e8e2d4;
      --accent:   #c84b2f;
      --accent-2: #2f6ec8;
      --muted:    #7a7368;
      --rule:     #d8d0c0;

      --fs-xl:   clamp(2.4rem, 5vw, 4rem);
      --fs-lg:   clamp(1.4rem, 2.5vw, 1.8rem);
      --fs-md:   1.05rem;
      --fs-sm:   0.875rem;

      --radius:  6px;
      --trans:   200ms cubic-bezier(0.25, 0, 0.1, 1);
    }

    /* ── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
      font-weight: 400;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .site-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 clamp(1.2rem, 5vw, 3rem);
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      border-bottom: 1.5px solid var(--rule);
      padding: 2.4rem 0 2rem;
    }

    .header-inner {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo-mark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .logo-divider {
      width: 1.5px;
      height: 1.1em;
      background: var(--rule);
      display: inline-block;
      transform: translateY(0.1em);
    }

    .logo-name {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Hero ───────────────────────────────────────────────────── */
    .hero {
      padding: clamp(3rem, 8vw, 6rem) 0 clamp(2rem, 5vw, 3.5rem);
      border-bottom: 1.5px solid var(--rule);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: var(--fs-xl);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      max-width: 16ch;
    }

    h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-sub {
      margin-top: 1.2rem;
      font-size: var(--fs-md);
      color: var(--muted);
      max-width: 52ch;
      font-weight: 300;
    }

    /* ── Main Form Area ─────────────────────────────────────────── */
    .workspace {
      padding: clamp(2rem, 5vw, 3.5rem) 0;
    }

    .field-label {
      font-family: 'Syne', sans-serif;
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.7rem;
    }

    .transcript-area {
      width: 100%;
      min-height: 240px;
      padding: 1.2rem 1.4rem;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: var(--fs-md);
      line-height: 1.7;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      resize: vertical;
      transition: border-color var(--trans), box-shadow var(--trans);
      outline: none;
    }

    .transcript-area::placeholder {
      color: #bbb5a8;
    }

    .transcript-area:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px oklch(from var(--accent-2) l c h / 0.12);
    }

    /* ── Options Row ────────────────────────────────────────────── */
    .options-row {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap select {
      appearance: none;
      padding: 0.5rem 2.4rem 0.5rem 0.9rem;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: var(--fs-sm);
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
      outline: none;
      transition: border-color var(--trans);
    }

    .select-wrap select:focus {
      border-color: var(--accent-2);
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Submit Button ──────────────────────────────────────────── */
    .btn-submit {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.6rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: var(--fs-sm);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--trans), transform var(--trans), box-shadow var(--trans);
    }

    .btn-submit:hover:not(:disabled) {
      background: #a83a21;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px oklch(from var(--accent) l c h / 0.28);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: none;
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Status / Loading ───────────────────────────────────────── */
    .status-bar {
      margin-top: 1rem;
      font-size: var(--fs-sm);
      color: var(--muted);
      min-height: 1.4em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Result ─────────────────────────────────────────────────── */
    .result-wrap {
      margin-top: clamp(2rem, 5vw, 3.5rem);
      padding-top: clamp(2rem, 5vw, 3.5rem);
      border-top: 1.5px solid var(--rule);
      animation: fadeUp 0.4s cubic-bezier(0.25, 0, 0.1, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
    }

    .result-title {
      font-family: 'Syne', sans-serif;
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--trans);
    }

    .btn-copy:hover {
      border-color: var(--ink);
      background: var(--warm-mid);
    }

    .btn-copy.copied {
      border-color: #2a8a5c;
      color: #2a8a5c;
    }

    .result-content {
      background: #fff;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.8rem 2rem;
      font-size: var(--fs-md);
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .result-content h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--rule);
    }

    .result-content h2:first-child {
      margin-top: 0;
    }

    .result-content ul {
      padding-left: 1.4em;
    }

    .result-content li {
      margin-bottom: 0.3em;
    }

    .result-content strong {
      font-weight: 500;
    }

    /* ── Error ──────────────────────────────────────────────────── */
    .error-box {
      margin-top: 1rem;
      padding: 0.9rem 1.2rem;
      background: #fff2f0;
      border: 1.5px solid #f5c2bc;
      border-radius: var(--radius);
      font-size: var(--fs-sm);
      color: #9c2a1c;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }

    .error-icon {
      flex-shrink: 0;
      margin-top: 0.1em;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    footer {
      padding: 2.5rem 0;
      border-top: 1.5px solid var(--rule);
      margin-top: clamp(2rem, 5vw, 4rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-copy {
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    .footer-badge {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
    }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .options-row {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-submit {
        margin-left: 0;
        justify-content: center;
      }
      .result-header {
        flex-direction: column;
      }
    }

    /* ── Hidden ─────────────────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="site-wrap">

  <!-- Header -->
  <header>
    <div class="header-inner">
      <span class="logo-mark">AI</span>
      <span class="logo-divider"></span>
      <span class="logo-name">Meeting Summarizer</span>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>把逐字稿<br>變成<em>結構摘要</em></h1>
    <p class="hero-sub">貼入會議記錄或逐字稿，AI 自動提取重點、決議與行動項目。</p>
  </section>

  <!-- Workspace -->
  <section class="workspace">
    <label class="field-label" for="transcript-input">會議逐字稿 / 會議記錄</label>
    <textarea
      id="transcript-input"
      class="transcript-area"
      placeholder="請在此貼上會議逐字稿、會議記錄或任何文字內容…&#10;&#10;例如：&#10;主持人：今天的重點是討論 Q3 預算分配…&#10;與會者甲：我建議優先投入行銷部門…"
      spellcheck="false"
      autocomplete="off"
    ></textarea>

    <div class="options-row">
      <div class="select-wrap">
        <select id="style-select" aria-label="摘要語言">
          <option value="zh-tw">繁體中文摘要</option>
          <option value="zh-cn">简体中文摘要</option>
          <option value="en">English Summary</option>
        </select>
      </div>

      <div class="select-wrap">
        <select id="length-select" aria-label="摘要詳細程度">
          <option value="concise">簡明版</option>
          <option value="detailed" selected>詳細版</option>
          <option value="bullet">純條列</option>
        </select>
      </div>

      <button id="submit-btn" class="btn-submit" type="button">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2L18 10L10 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        生成摘要
      </button>
    </div>

    <div class="status-bar" id="status-bar" aria-live="polite"></div>
    <div class="error-box hidden" id="error-box" role="alert">
      <span class="error-icon">⚠</span>
      <span id="error-msg"></span>
    </div>

    <!-- Result -->
    <div class="result-wrap hidden" id="result-wrap">
      <div class="result-header">
        <span class="result-title">摘要結果</span>
        <button class="btn-copy" id="copy-btn" type="button">複製全文</button>
      </div>
      <div class="result-content" id="result-content"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <span class="footer-copy">Powered by Gemini AI</span>
    <span class="footer-badge">Meeting Summarizer</span>
  </footer>

</div>

<script>
  // ── Configuration ────────────────────────────────────────────────
  // Replace with your deployed GAS Web App URL
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbypwikHpuWlOPBmQf_2k9wNKAF_P23nXEf_vHIATFKoTTWTDOQmNpUlkm8HtAKO5EkBbA/exec';

  // ── DOM References ───────────────────────────────────────────────
  const input     = document.getElementById('transcript-input');
  const styleSelect = document.getElementById('style-select');
  const lengthSelect = document.getElementById('length-select');
  const submitBtn = document.getElementById('submit-btn');
  const statusBar = document.getElementById('status-bar');
  const errorBox  = document.getElementById('error-box');
  const errorMsg  = document.getElementById('error-msg');
  const resultWrap = document.getElementById('result-wrap');
  const resultContent = document.getElementById('result-content');
  const copyBtn   = document.getElementById('copy-btn');

  // ── Helpers ──────────────────────────────────────────────────────
  function setStatus(msg, loading = false) {
    statusBar.innerHTML = loading
      ? `<span class="spinner"></span><span>${msg}</span>`
      : `<span>${msg}</span>`;
  }

  function clearStatus() {
    statusBar.innerHTML = '';
  }

  function showError(msg) {
    errorBox.classList.remove('hidden');
    errorMsg.textContent = msg;
  }

  function hideError() {
    errorBox.classList.add('hidden');
    errorMsg.textContent = '';
  }

  function renderMarkdown(text) {
    // Simple markdown: ## headings, **bold**, - list items
    return text
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/gs, m => `<ul>${m}</ul>`)
      .trim();
  }

  // ── Submit ───────────────────────────────────────────────────────
  async function handleSubmit() {
    const transcript = input.value.trim();

    if (!transcript) {
      showError('請先貼上會議逐字稿或會議記錄。');
      input.focus();
      return;
    }

    if (transcript.length < 30) {
      showError('內容太短，請貼上至少 30 個字元的內容。');
      input.focus();
      return;
    }

    if (GAS_URL === 'YOUR_GAS_WEB_APP_URL_HERE') {
      showError('尚未設定後端 URL，請將 GAS_URL 替換為你的 Google Apps Script Web App 網址。');
      return;
    }

    hideError();
    resultWrap.classList.add('hidden');
    submitBtn.disabled = true;
    setStatus('正在分析逐字稿，請稍候…', true);

    try {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          transcript,
          style:  styleSelect.value,
          length: lengthSelect.value,
        }),
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`伺服器回應錯誤 (${response.status})${errText ? '：' + errText : ''}`);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error);
      }

      if (!data.summary) {
        throw new Error('後端未回傳摘要內容，請稍後再試。');
      }

      // Render
      resultContent.innerHTML = renderMarkdown(data.summary);
      resultWrap.classList.remove('hidden');
      resultWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      clearStatus();

    } catch (err) {
      clearStatus();
      showError(err.message || '發生未知錯誤，請稍後再試。');
    } finally {
      submitBtn.disabled = false;
    }
  }

  // ── Copy ─────────────────────────────────────────────────────────
  copyBtn.addEventListener('click', async () => {
    const text = resultContent.innerText || resultContent.textContent;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = '已複製！';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '複製全文';
        copyBtn.classList.remove('copied');
      }, 2000);
    } catch {
      // Fallback
      const range = document.createRange();
      range.selectNodeContents(resultContent);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      copyBtn.textContent = '已複製！';
      setTimeout(() => { copyBtn.textContent = '複製全文'; }, 2000);
    }
  });

  // ── Event Listeners ──────────────────────────────────────────────
  submitBtn.addEventListener('click', handleSubmit);

  input.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      handleSubmit();
    }
  });
</script>
</body>
</html>
